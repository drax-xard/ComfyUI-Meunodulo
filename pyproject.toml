[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meunodulo"
version = "0.2.0"
description = "ComfyUI-Meunodulo: a collection of custom nodes for ComfyUI (styled text label, resolution calculator)."
authors = [
  { name = "Drax", email = "vicodyn@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent"
]
dependencies = []

[project.urls]
Repository = "https://github.com/meunodulo/ComfyUI-Meunodulo"
BugTracker = "https://github.com/meunodulo/ComfyUI-Meunodulo/issues"
Documentation = "https://github.com/meunodulo/ComfyUI-Meunodulo/wiki"

[tool.comfy]
PublisherId = "meunodulo"
DisplayName = "ComfyUI-Meunodulo"
Icon = ""
Tags = []
Repository = "https://github.com/meunodulo/ComfyUI-Meunodulo"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.*"]
